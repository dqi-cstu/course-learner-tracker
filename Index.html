function sleepMs(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

function isTransientAttendanceError_(err){
 const m=String((err&&err.message)||err||'').toLowerCase();
 return (
   m.includes('too many simultaneous') ||
   m.includes('service invoked too many times') ||
   m.includes('server error') ||
   m.includes('internal error') ||
   m.includes('temporarily unavailable') ||
   m.includes('timed out') ||
   m.includes('timeout') ||
   m.includes('network')
 );
}

async function checkInWithRetry_(args,onRetry){
 const waits=[0,500+Math.floor(Math.random()*700),1200+Math.floor(Math.random()*1500)];
 let lastErr=null;
 for(let i=0;i<waits.length;i++){
   if(waits[i])await sleepMs(waits[i]);
   try{
     return await call('checkIn',args);
   }catch(err){
     lastErr=err;
     if(i===waits.length-1||!isTransientAttendanceError_(err))throw err;
     if(onRetry)onRetry(i+2);
   }
 }
 throw lastErr||new Error('Unable to record attendance.');
}

function renderCheckin(){
 const c=BOOT.checkin;
 document.getElementById('app').innerHTML=`<div class="card" style="max-width:620px;margin:auto">
   <h2>Class Check-in</h2>
   <p>Student: <strong>${esc(BOOT.student.alias)}</strong></p>
   <div id="checkMsg">${loadingHtml('Checking session…','Verifying the current QR code and attendance requirements',true)}</div>
   <div class="space"></div>
   <button id="checkBtn" class="primary" disabled>Check in now</button>
 </div>`;

 const btn=document.getElementById('checkBtn');
 const msg=document.getElementById('checkMsg');

 call('getCheckinInfo',[c.sessionId,c.token]).then(info=>{
   if(!info.open){
     msg.innerHTML=`<span class="bad">${esc(info.message)}</span>`;
     return;
   }

   if(info.locationRequired){
     msg.innerHTML=`<div>
       <strong>Location verification is enabled for this session.</strong>
       <p class="small muted" style="margin-bottom:0">
         Please turn on Location Services/GPS on your device and allow this browser to use your location.
         You may still submit a check-in without location, but you will <strong>not</strong> be marked Present
         unless the location criterion is passed${info.radiusM?` (configured radius: ${esc(info.radiusM)} m)` : ''}.
       </p>
     </div>`;
   }else{
     msg.innerHTML='<span class="muted">Ready to check in. Location is not required for this session.</span>';
   }

   btn.disabled=false;
   btn.onclick=async e=>{
     const b=e.currentTarget;
     busy(b,true);
     msg.innerHTML=loadingHtml(
       info.locationRequired?'Checking location and attendance…':'Recording attendance…',
       info.locationRequired?'If location is unavailable, the attempt will still be recorded but not marked Present.':'',
       true
     );

     try{
       let loc={};
       if(info.locationRequired) loc=await getLocation();

       const r=await checkInWithRetry_(
         [c.sessionId,c.token,loc],
         attempt=>{
           msg.innerHTML=loadingHtml(
             'Recording attendance…',
             `The server is busy with class check-ins. Retrying automatically (attempt ${attempt} of 3)…`,
             true
           );
         }
       );

       if(r.attendanceStatus==='Present'||r.attendanceStatus==='Late'){
         msg.innerHTML=`<div>
           <div class="ok"><strong>✓ ${esc(r.attendanceStatus)}</strong> — ${esc(r.message)}</div>
           ${r.distanceM!==''&&r.distanceM!=null?`<div class="small muted" style="margin-top:6px">Approx. ${esc(r.distanceM)} m from the class reference point${r.accuracyM!==''&&r.accuracyM!=null?` · location accuracy ±${esc(r.accuracyM)} m`:''}.</div>`:''}
         </div>`;
         b.disabled=true;
         b.textContent='Checked in';
       }else{
         const locationText=r.attendanceStatus==='Outside Allowed Area'
           ? `Your location was approximately ${esc(r.distanceM)} m from the class reference point${r.radiusM?`; configured radius ${esc(r.radiusM)} m`:''}.`
           : 'Location was not available or could not be verified.';

         msg.innerHTML=`<div>
           <div class="bad"><strong>Check-in recorded — ${esc(r.attendanceStatus)}</strong></div>
           <p style="margin-bottom:6px">${esc(r.message)}</p>
           <div class="small muted">${locationText}</div>
           <div class="small" style="margin-top:8px">
             Turn on Location Services/GPS and allow browser location access, then use <strong>Try location again</strong> while the session is still open.
           </div>
         </div>`;
         b.disabled=false;
         b.textContent='Try location again';
         busy(b,false);
       }
     }catch(err){
       msg.innerHTML=`<span class="bad">${esc(err.message)}</span>`;
       busy(b,false);
     }
   };
 }).catch(err=>{
   msg.innerHTML=`<span class="bad">${esc(err.message)}</span>`;
 });
}


function fileToBase64(file){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>{
     const result=String(reader.result||'');
     const comma=result.indexOf(',');
     resolve(comma>=0?result.substring(comma+1):result);
   };
   reader.onerror=()=>reject(new Error('Unable to read the selected file.'));
   reader.readAsDataURL(file);
 });
}

function getLocation(){
 return new Promise(resolve=>{
  if(!navigator.geolocation){
    return resolve({
      unavailable:true,
      errorCode:'UNAVAILABLE',
      errorMessage:'Location services are not available in this browser.'
    });
  }

  navigator.geolocation.getCurrentPosition(
    p=>resolve({
      lat:p.coords.latitude,
      lng:p.coords.longitude,
      accuracy:p.coords.accuracy
    }),
    err=>{
      let message='Location could not be obtained.';
      let code='ERROR';
      if(err&&err.code===1){
        code='DENIED';
        message='Location permission is off or was denied.';
      }else if(err&&err.code===2){
        code='UNAVAILABLE';
        message='Your device could not determine its current location.';
      }else if(err&&err.code===3){
        code='TIMEOUT';
        message='Location lookup timed out.';
      }
      resolve({
        unavailable:true,
        errorCode:code,
        errorMessage:message
      });
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
 });
}
function formatDateOnly_(v){
 if(!v)return'';
 const raw=String(v||'').trim();
 let d;
 if(/^\d{4}-\d{2}-\d{2}$/.test(raw))d=new Date(raw+'T00:00:00');else d=new Date(raw);
 if(Number.isNaN(d.getTime()))return raw;
 if(UI_LANGUAGE==='th'){
   const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
   return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
 }
 return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric'}).format(d);
}
function fmtDate(v){
 if(!v)return'—';
 const d=new Date(v);
 if(Number.isNaN(d.getTime()))return esc(v);
 if(UI_LANGUAGE==='th'){
   const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
   const pad=n=>String(n).padStart(2,'0');
   return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543} · ${pad(d.getHours())}:${pad(d.getMinutes())} น.`;
 }
 return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d);
}
